<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="26" fill="#0d0d1a" />
  <rect x="4" y="4" width="92" height="92" rx="22" fill="none" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4" />
  <!-- Brain / Neural nodes stylized -->
  <g transform="translate(18, 18)" filter="url(#glow)">
    <circle cx="20" cy="18" r="9" fill="url(#grad)" />
    <circle cx="44" cy="18" r="9" fill="url(#grad)" />
    <circle cx="14" cy="34" r="8" fill="#6366f1" />
    <circle cx="50" cy="34" r="8" fill="#10b981" />
    <circle cx="24" cy="48" r="9" fill="#a855f7" />
    <circle cx="40" cy="48" r="9" fill="#06b6d4" />
    <!-- Synaptic connections -->
    <path d="M20 18 L44 18 M20 18 L14 34 M44 18 L50 34 M14 34 L24 48 M50 34 L40 48 M24 48 L40 48 M20 18 L40 48 M44 18 L24 48" 
          stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85" />
    <!-- Sparkling node centers -->
    <circle cx="32" cy="33" r="4" fill="#fbbf24" />
  </g>
</svg>
